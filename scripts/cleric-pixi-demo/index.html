<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>여성 신관 · PixiJS 이동 데모</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.5 system-ui, sans-serif; background: #10171b; color: #e6eee9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; background: #192328; border-bottom: 1px solid #34454a; }
    h1 { margin: 0; font-size: 19px; }
    header p { margin: 3px 0 0; color: #a9bbb6; }
    a { color: #a5e6cb; }
    nav { display: flex; gap: 14px; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    #status { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 12px; color: #c4d3ce; }
    #stage { height: min(68vh, 640px); min-height: 320px; overflow: hidden; border: 1px solid #40545a; border-radius: 10px; background: #202b2e; }
    #stage canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    #error { display: none; padding: 16px; white-space: pre-wrap; color: #ffd3c8; background: #492b2b; border-radius: 8px; }
    .hint { color: #9cb0aa; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div><h1>여성 신관 · 8방향 이동</h1><p>방향키 또는 WASD로 이동 · 대각선 이동 속도 보정 · 키를 놓으면 마지막 방향 idle</p></div>
    <nav aria-label="리소스 다운로드"><a href="./cleric-atlas.json" download>atlas JSON</a><a href="./cleric-manifest.json" download>manifest JSON</a><a id="atlas-download" href="./cleric-atlas.png" download>atlas PNG</a></nav>
  </header>
  <main>
    <div id="status" aria-live="polite"><span>상태: <b id="load-state">불러오는 중</b></span><span>방향: <b id="direction">—</b></span><span>동작: <b id="action">—</b></span><span>프레임: <b id="frame">—</b></span><span>위치: <b id="position">—</b></span></div>
    <div id="error" role="alert"></div>
    <div id="stage" aria-label="게임 화면"></div>
    <p class="hint">파일은 같은 폴더에 둡니다: <code>cleric-atlas.json</code>, <code>cleric-manifest.json</code>, <code>cleric-atlas.png</code>.</p>
  </main>
  <script src="./vendor/pixi.min.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
